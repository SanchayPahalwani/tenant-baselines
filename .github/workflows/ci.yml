# Unit tests for the Flink job and the Python tools. `make ci` runs the same commands
# locally in the same images. The compose smoke test (`make smoke`) is local only.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flink-job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the tests that compare the tree with the freeze commit skip without it.
          fetch-depth: 0
      # setup-uv publishes no major-version tag after v7, so this pins its latest release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  alertmanager-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-am.sh
