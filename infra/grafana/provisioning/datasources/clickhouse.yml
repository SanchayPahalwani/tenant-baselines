apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: tb
      defaultDatabase: tb
    secureJsonData:
      # Local demo credential, not a secret.
      password: tb-local
