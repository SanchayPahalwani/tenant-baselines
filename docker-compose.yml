# Local stack for the tenant-baselines demo. Memory limits total 8576m and fit a
# 10 GB Docker VM. Data lives in named volumes; only config, scripts and the job
# project are bind-mounted, read-only. Published ports listen on loopback only.

# Three retained checkpoints, 30 s apart: the oldest is at least 60 s old, which
# scripts/submit-job.sh --from-checkpoint relies on.
x-flink-properties: &flink-properties |
  jobmanager.rpc.address: jobmanager
  state.backend.type: rocksdb
  execution.checkpointing.incremental: true
  execution.checkpointing.dir: file:///flink-data/checkpoints
  execution.checkpointing.interval: 30 s
  execution.checkpointing.num-retained: 3
  execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
  restart-strategy.type: fixed-delay
  restart-strategy.fixed-delay.attempts: 10
  restart-strategy.fixed-delay.delay: 10 s
  jobmanager.memory.process.size: 1024m
  taskmanager.memory.process.size: 2560m
  taskmanager.numberOfTaskSlots: 4
  parallelism.default: 2

# pager-sink, forwarder and generator each build from py/; the builds share every layer.
x-py-image: &py-image
  build: ./py

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    mem_limit: 1536m
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # The CLI tool runs in the broker's container, so give it a small heap of its own.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.4.0
    mem_limit: 256m
    restart: "no"
    command: ["bash", "/opt/tb-kafka/create-topics.sh"]
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes:
      - ./infra/kafka:/opt/tb-kafka:ro
    depends_on:
      kafka:
        condition: service_healthy

  flink-data-init:
    image: flink:2.2.1-java17
    user: root
    entrypoint: ["chown", "-R", "9999:9999", "/flink-data"]
    volumes:
      - flink-data:/flink-data

  jobmanager:
    image: flink:2.2.1-java17
    command: jobmanager
    mem_limit: 1024m
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-data:/flink-data
      # The parent directory, not target/: `mvn clean` deletes and recreates target/,
      # which would leave a running container with an empty mount.
      - ./flink-job:/opt/tb-job:ro
      - ./infra/flink:/opt/tb-config:ro
      - ./scripts:/opt/tb-scripts:ro
    depends_on:
      flink-data-init:
        condition: service_completed_successfully

  taskmanager:
    image: flink:2.2.1-java17
    command: taskmanager
    mem_limit: 2560m
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink-data:/flink-data
    depends_on:
      flink-data-init:
        condition: service_completed_successfully
      jobmanager:
        condition: service_started

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    mem_limit: 1536m
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: tb
      CLICKHOUSE_USER: tb
      # Local demo credential, not a secret.
      CLICKHOUSE_PASSWORD: tb-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  alertmanager:
    image: prom/alertmanager:v0.34.2
    mem_limit: 128m
    # A single instance: an empty cluster address turns off gossip with peers.
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  pager-sink:
    <<: *py-image
    mem_limit: 256m
    command: ["python", "-m", "tenant_baselines.pager_sink", "--port", "8099", "--log", "/data/notifications.jsonl"]
    volumes:
      - pager-data:/data

  forwarder:
    <<: *py-image
    mem_limit: 256m
    restart: unless-stopped
    command:
      - python
      - -m
      - tenant_baselines.forwarder
      - --bootstrap
      - kafka:19092
      - --topic
      - live.alerts
      - --alertmanager
      - http://alertmanager:9093
      - --live-detector
      - global_static
      - --live-setting
      - default
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      alertmanager:
        condition: service_started

  generator:
    <<: *py-image
    mem_limit: 512m
    profiles: ["demo"]
    command:
      - python
      - -m
      - tenant_baselines.gen_live
      - --bootstrap
      - kafka:19092
      - --topic
      - live.events
      - --world
      - demo
      - --seed
      - "1"
      - --script
      - demo
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:13.2.5
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.4
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro

# A fixed subnet, so the stack doesn't depend on Docker's default address pools
# having a free range.
networks:
  default:
    ipam:
      config:
        - subnet: 10.231.0.0/24

volumes:
  kafka-data:
  flink-data:
  ch-data:
  grafana-data:
  pager-data:
